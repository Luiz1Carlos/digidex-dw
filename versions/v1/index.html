<!doctype html>
<html lang="pt-br">
  <head>

    <link rel="stylesheet" href="css/style.css" />

        <div class="count-header-cabecario">

      </div>

    <main>

                <input class="search-input" id="busca" type="text" placeholder="Buscar Digimon...">

            </div>
            <div class="container-cards">
              <div class="card" id="lista-digimons"></div>

            </div>

          </div>

        </div>

      </div>

    </main>
    
    <footer>
      <div class="container-footer">
        <div class="conteudo-footer"></div>
      </div>
    </footer>

    <script src="js/data/digimons.js"></script>
    <script src="js/main.js"></script>

</html>
